<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna Eletrônica</title>
    <link rel="stylesheet" href="Urna_Escolar.css">
</head>
<body>
    <main class="painel">
        <span class="etiqueta">Eleição escolar • 2026</span>
        <h1>Urna Eletrônica</h1>
        <h2>Eleição da Escola Estadual Duarte de Abreu</h2>
        <p class="instrucao">Para começar, informe seu nome.</p>

        <form id="form-identificacao" action="#" method="post">
            <label for="nome">Nome:</label>
            <input id="nome" name="nome" type="text" placeholder="Digite seu nome" autocomplete="name">
            <button type="submit">Continuar</button>
            <p id="mensagem" aria-live="polite"></p>
        </form>

        <h3>Pronto para votar?</h3>
        <p class="rodape">Seu voto ajuda a construir o futuro da escola.</p>
    </main>
</body>
</html>
